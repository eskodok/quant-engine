name: Data harian + scan

on:
  schedule:
    # 23:15 UTC Minggu–Kamis = 06:15 WIB Senin–Jumat (sebelum laporan Claude jam 07:00 WIB)
    - cron: "15 23 * * 0-4"
  workflow_dispatch:
    inputs:
      run_validation:
        description: "Jalankan juga validasi walk-forward (lama, ~10-20 menit)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Uji engine (anti-GIGO)
        run: python -m pytest tests -q

      - name: Tarik data watchlist
        run: python scripts/fetch_data.py

      - name: Validasi mingguan (Minggu malam UTC, atau bila diminta manual)
        run: |
          if [ "${{ github.event.inputs.run_validation }}" = "true" ] || [ "$(date -u +%u)" = "7" ]; then
            python scripts/run_validate.py
          else
            echo "bukan hari Minggu, validasi dilewati"
          fi

      - name: Scan harian
        run: python scripts/run_daily.py

      - name: Commit hasil ke repo
        run: |
          git config user.name "quant-engine-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data reports
          git commit -m "data+scan $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "tidak ada perubahan"
          git push
